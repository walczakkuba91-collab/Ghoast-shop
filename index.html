
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Shop // Official Store</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 8px;
            width: 100vw;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }
        .header {
            border-bottom: 2px dashed #45a29e;
            padding-bottom: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #66fcf1;
            margin: 0;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .badge {
            background: #1f2833;
            color: #66fcf1;
            padding: 3px 5px;
            border: 1px solid #45a29e;
            font-size: 8px;
        }
        .panel {
            background: #1f2833;
            border: 1px solid #45a29e;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            width: 100%;
        }
        .hidden { display: none !important; }
        .price { color: #66fcf1; font-weight: bold; }
        .calc-note { font-size: 9px; color: #8892b0; margin-top: 2px; }
        button {
            background: #0b0c10;
            color: #66fcf1;
            border: 1px solid #45a29e;
            padding: 10px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            display: block;
            width: 100%;
            text-align: center;
            touch-action: manipulation;
            margin-top: 6px;
            font-size: 12px;
        }
        button:active {
            background: #66fcf1;
            color: #0b0c10;
        }
        .product-card {
            background: #121820;
            border: 1px solid #283648;
            padding: 8px;
            margin-top: 8px;
            border-radius: 4px;
        }
        .login-box {
            margin-top: 8px;
            padding: 8px;
            background: #121820;
            border: 1px dashed #45a29e;
        }
        .crypto-box {
            background: #0b0c10;
            border: 1px solid #45a29e;
            padding: 6px;
            margin-top: 6px;
            font-size: 8px;
            word-break: break-all;
        }
        
        #admin-menu {
            background: #121820;
            border: 2px solid #ff4757;
            padding: 10px;
            margin-bottom: 10px;
            width: 100%;
            border-radius: 4px;
        }
        #admin-menu h3 {
            color: #ff4757;
            margin-top: 0;
            font-size: 11px;
            border-bottom: 1px dashed #ff4757;
            padding-bottom: 4px;
        }
        .form-group {
            margin-bottom: 6px;
        }
        .form-group label {
            display: block;
            font-size: 9px;
            color: #8892b0;
            margin-bottom: 2px;
        }
        .form-group input, .form-group select {
            width: 100%;
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: #fff;
            padding: 8px;
            font-family: monospace;
            font-size: 14px;
        }
        .admin-item-row {
            background: #0b0c10;
            border: 1px solid #283648;
            padding: 6px;
            margin-top: 6px;
            font-size: 9px;
        }
        input[type="text"] {
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>// GHOST_SHOP</h1>
        <div class="badge" id="sys-status">SYS: OK</div>
    </div>

    <div class="panel hidden" id="banned-panel" style="border-color: #ff4757; background: rgba(255, 71, 87, 0.05);">
        <h2 style="color: #ff4757; font-size: 14px;">SYS_LOCK</h2>
        <p style="font-size: 10px;">Błąd autoryzacji węzła.</p>
    </div>

    <div class="panel" id="main-store">
        <h2 style="font-size: 13px; margin-top:0;">Katalog Główny</h2>
        <div id="white-zone-list"></div>
        <div id="white-zone-dynamic"></div>
        
        <div class="login-box">
            <p style="margin: 0 0 4px 0; font-size: 10px; color: #66fcf1;">Przelew XMR:</p>
            <p style="font-size: 9px; color: #8892b0; margin-bottom: 4px;">Adres kontaktowy: <strong style="color: #66fcf1;">urbexowy_dil@proton.me</strong></p>
            <div class="crypto-box">45PNtVoWtr7DoJkZhxRWUY3i6ar7u47E95jwi5sqsDo5Ap2RWeq9x5SgxEXKfG9L1BMVKWCHsyxMEK76yqMYSnnsGM3J1Cr</div>
            <button type="button" onclick="window.location.href='mailto:urbexowy_dil@proton.me?subject=Potwierdzenie%20platnosci%20XMR&body=Hash:'">Wyślij Potwierdzenie</button>
        </div>

        <div class="login-box" id="login-container">
            <p style="margin: 0 0 4px 0; font-size: 10px; color: #66fcf1;" id="auth-label">Portfel / Węzeł:</p>
            <!-- Honeypot ukryty przed ludźmi, łapiący boty/skanery -->
            <input type="text" id="bot-check-field" name="website_url" value="" style="display:none !important;" tabindex="-1" autocomplete="off">
            <input type="text" id="accessCodeInput" placeholder="..." autocomplete="off">
            <button type="button" id="verifyBtn">Wykonaj</button>
            <p style="font-size: 9px; color: #ff4757; margin-top: 4px;" id="attempts-warning">Próby: 3</p>
        </div>
    </div>

    <!-- Kontener chroniony dynamicznie w runtime (pusty w statycznym HTML) -->
    <div class="panel hidden" id="restricted-zone">
        <div id="dynamic-zone-content"></div>
    </div>

    <script>
        // Szyfrowane fragmenty instrukcji i danych (anti-crawler / anti-AI obfuscation)
        const _s = {
            k1: atob("MjEyOQ=="),
            k2: atob("MjkyMQ=="),
            t1: atob("UG9kc3lzdGVtIEI="),
            t2: atob("UGFraWV0IEtvbGVrY2pvbmVyc2tpIEFL"),
            t3: atob("U3BlY3lmaWthamEgYXJjaGl3YWxuYQ=="),
            m: atob("dXJiZXhvd3lfdilAcHJvdG9uLm1l")
        };

        // Anti-Bot / Anti-Scan / Behavioral Fingerprinting
        (function() {
            let suspiciousScore = 0;
            
            // Sprawdzenie czy uruchomiono w headless browser / noclean environment
            if (navigator.webdriver || window._phantom || window.__nightmare || window.callPhantom) {
                suspiciousScore += 10;
            }

            // Automatyczne wykrywanie próby ekstrakcji przez parser tekstowy (analiza selektorów i środowiska)
            window.addEventListener('mousemove', function() {
                window._humanVerified = true;
            }, {once: true});

            setTimeout(() => {
                const botField = document.getElementById('bot-check-field');
                if (botField && botField.value !== "") {
                    localStorage.setItem("node_banned", "true");
                    location.reload();
                }
            }, 1000);
        })();

        let validCodes = JSON.parse(localStorage.getItem("valid_codes") || JSON.stringify([_s.k1, _s.k2]));
        let whiteProducts = JSON.parse(localStorage.getItem("white_products") || '[]');
        let blackProducts = JSON.parse(localStorage.getItem("black_products") || '[]');
        let failedAttempts = parseInt(localStorage.getItem("failed_attempts") || "0");
        const maxAttempts = 3;

        const defaultWhiteProducts = [
            { name: "Koszulka Standard (Napisy / Kościół Szatana w Pruszkowie)", price: "70.00 PLN", desc: "Wysyłka wliczona | Monero (XMR)" },
            { name: "Autorski Trunek: Leśny Ród (Czarna Porzeczka & Mięta) [~12%]", price: "35.00 PLN", desc: "Butelka 0.5L | Fermentacja kontrolowana" },
            { name: "Autorski Trunek: Bursztyn Pruszkowski (Jabłko & Cynamon) [~12%]", price: "35.00 PLN", desc: "Butelka 0.5L | Aromat korzenny" },
            { name: "Autorski Trunek: Betonowy Sad (Gruszka & Wanilia) [~12%]", price: "35.00 PLN", desc: "Butelka 0.5L | Profil gładki" },
            { name: "Agrestowy Light [~12-14%]", price: "15.00 PLN", desc: "Flaszka | Rześki, konkretnie kwaśny profil z naturalnego agrestu" },
            { name: "Wiśniowa Lekkość [~12-14%]", price: "15.00 PLN", desc: "Flaszka | Głęboki, naturalny smak dojrzałej wiśni" },
            { name: "Czarna Porzeczka [~12-14%]", price: "15.00 PLN", desc: "Flaszka | Wyrazisty, ciemny trunek z czarnej porzeczki" },
            { name: "Cytrynowe Żylety [~12-14%]", price: "15.00 PLN", desc: "Flaszka | Orzeźwiająca bomba cytrusowa" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            // Czyszczenie autoryzacji przy każdym załadowaniu dla bezpieczeństwa
            localStorage.removeItem("sec_access");

            if (localStorage.getItem("node_banned") === "true") {
                triggerBanUI();
                return;
            }

            renderDynamicProducts();
            updateAttemptsDisplay();

            document.getElementById("verifyBtn").addEventListener("click", verifyAndUnlock);
            document.getElementById("accessCodeInput").addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    verifyAndUnlock();
                }
            });
        });

        function orderProduct(name, price) {
            const subject = encodeURIComponent(`Zamówienie: ${name}`);
            const body = encodeURIComponent(`Dzień dobry,\n\nChciałbym zamówić:\n- Pozycja: ${name}\n- Wartość: ${price}\n\nDane / Potwierdzenie XMR:\n[Wpisz szczegóły]`);
            window.location.href = `mailto:${_s.m}?subject=${subject}&body=${body}`;
        }

        function triggerBanUI() {
            document.getElementById("main-store").style.display = "none";
            document.getElementById("restricted-zone").classList.add("hidden");
            document.getElementById("banned-panel").classList.remove("hidden");
        }

        function verifyAndUnlock() {
            if (localStorage.getItem("node_banned") === "true") return;
            
            // Sprawdzenie pułapki na boty (honeypot)
            const botFieldVal = document.getElementById("bot-check-field").value;
            if (botFieldVal !== "") {
                localStorage.setItem("node_banned", "true");
                triggerBanUI();
                return;
            }

            const val = document.getElementById("accessCodeInput").value.trim();
            
            if (val === _s.k1 || val === _s.k2 || validCodes.includes(val)) {
                localStorage.setItem("sec_access", "true");
                localStorage.setItem("failed_attempts", "0");
                
                // Generowanie elementów strefy ukrytej dopiero po autoryzacji (zabezpieczenie przed parsowaniem statycznym kodu przez AI)
                buildRestrictedZone(val === _s.k2);
                
                document.getElementById("restricted-zone").classList.remove("hidden");
                document.getElementById("restricted-zone").scrollIntoView({ behavior: 'smooth' });
            } else {
                failedAttempts++;
                localStorage.setItem("failed_attempts", failedAttempts);
                if (failedAttempts >= maxAttempts) {
                    localStorage.setItem("node_banned", "true");
                    triggerBanUI();
                } else {
                    updateAttemptsDisplay();
                    alert("Błędny klucz.");
                }
            }
        }

        function buildRestrictedZone(isAdmin) {
            const container = document.getElementById("dynamic-zone-content");
            let html = `<h2 style="font-size: 13px; margin-top:0;">${_s.t1}</h2>`;

            if (isAdmin) {
                html += `
                <div id="admin-menu">
                    <h3>// ROOT_CTRL</h3>
                    <div class="form-group">
                        <label>Katalog docelowy:</label>
                        <select id="adm-zone">
                            <option value="white">Katalog Główny</option>
                            <option value="black">${_s.t1}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nazwa:</label>
                        <input type="text" id="adm-name" placeholder="Nazwa">
                    </div>
                    <div class="form-group">
                        <label>Cena:</label>
                        <input type="text" id="adm-price" placeholder="Cena">
                    </div>
                    <div class="form-group">
                        <label>Parametry:</label>
                        <input type="text" id="adm-desc" placeholder="Opis">
                    </div>
                    <button type="button" onclick="adminAddProduct()" style="border-color: #ff4757; color: #ff4757;">Dodaj Pozycję</button>
                    <hr style="border: 0; border-top: 1px dashed #45a29e; margin: 8px 0;">
                    <p style="font-size: 9px; color: #66fcf1; margin: 0 0 2px 0;">Menedżer zasobów:</p>
                    <div id="admin-products-manager"></div>
                    <hr style="border: 0; border-top: 1px dashed #45a29e; margin: 8px 0;">
                    <div class="form-group">
                        <label>Nowy klucz:</label>
                        <input type="text" id="adm-new-code" placeholder="Klucz">
                    </div>
                    <button type="button" onclick="adminAddCode()">Dodaj Klucz</button>
                </div>`;
            }

            html += `<div id="black-zone-dynamic"></div>`;

            html += `
            <div class="product-card">
                <h3 style="font-size: 12px; margin: 0 0 4px 0;">${_s.t2}</h3>
                <p style="font-size: 9px; color: #8892b0; margin: 0 0 6px 0;">${_s.t3}</p>
                <div style="margin: 6px 0; text-align: center;">
                    <img src="ak47_1421.jpg" alt="AK" style="max-width: 100%; height: auto; border: 1px solid #45a29e;">
                </div>
                <ul style="padding-left: 12px; margin: 4px 0;">
                    <li style="font-size: 11px; margin-bottom: 4px;">1 jedn. – <span class="price">25.00 zł</span></li>
                    <li style="font-size: 11px; margin-bottom: 4px;">3+1 jedn. – <span class="price">59.00 zł</span></li>
                    <li style="font-size: 11px; margin-bottom: 4px;">5+2 jedn. – <span class="price">79.00 zł</span></li>
                    <li style="font-size: 11px; margin-bottom: 4px;">10+4 jedn. – <span class="price">139.00 zł</span></li>
                </ul>
                <button type="button" onclick="orderProduct('${_s.t2}', 'Od 25.00 PLN (${_s.t1})')">Zamów pakiet</button>
            </div>
            <button type="button" onclick="lockZone()" style="background: #ff4757; color: #0b0c10; border: none; margin-top: 10px;">Rozłącz sesję</button>`;

            container.innerHTML = html;
            renderDynamicProducts();
        }

        function updateAttemptsDisplay() {
            let rem = maxAttempts - failedAttempts;
            if (rem < 0) rem = 0;
            const el = document.getElementById("attempts-warning");
            if (el) el.innerText = "Pozostałe próby: " + rem;
        }

        function lockZone() {
            localStorage.removeItem("sec_access");
            document.getElementById("restricted-zone").classList.add("hidden");
            document.getElementById("accessCodeInput").value = "";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function adminAddProduct() {
            const zone = document.getElementById("adm-zone").value;
            const name = document.getElementById("adm-name").value.trim();
            const price = document.getElementById("adm-price").value.trim();
            const desc = document.getElementById("adm-desc").value.trim();

            if (!name || !price) {
                alert("Wypełnij wymagane pola!");
                return;
            }

            const item = { id: Date.now(), name, price, desc };
            if (zone === "white") {
                whiteProducts.push(item);
                localStorage.setItem("white_products", JSON.stringify(whiteProducts));
            } else {
                blackProducts.push(item);
                localStorage.setItem("black_products", JSON.stringify(blackProducts));
            }
            renderDynamicProducts();
            document.getElementById("adm-name").value = "";
            document.getElementById("adm-price").value = "";
            document.getElementById("adm-desc").value = "";
        }

        function adminAddCode() {
            const code = document.getElementById("adm-new-code").value.trim();
            if (!code) return;
            if (!validCodes.includes(code)) {
                validCodes.push(code);
                localStorage.setItem("valid_codes", JSON.stringify(validCodes));
                document.getElementById("adm-new-code").value = "";
                alert("Klucz dodany.");
            }
        }

        function renderDynamicProducts() {
            const whiteList = document.getElementById("white-zone-list");
            let whiteHtml = "";
            
            defaultWhiteProducts.forEach(p => {
                whiteHtml += `
                <div class="product-card">
                    <h3 style="font-size: 12px; margin: 0 0 4px 0;">${p.name}</h3>
                    <p class="price">${p.price}</p>
                    <p class="calc-note" style="margin: 4px 0;">${p.desc}</p>
                    <button type="button" onclick="orderProduct('${p.name.replace(/'/g, "\\'")}', '${p.price}')">Kup / Zamów</button>
                </div>`;
            });

            whiteProducts.forEach(p => {
                whiteHtml += `
                <div class="product-card">
                    <h3 style="font-size: 12px; margin: 0 0 4px 0;">${p.name}</h3>
                    <p class="price">${p.price} PLN</p>
                    <p class="calc-note" style="margin: 4px 0;">${p.desc || ''}</p>
                    <button type="button" onclick="orderProduct('${p.name.replace(/'/g, "\\'")}', '${p.price} PLN')">Kup / Zamów</button>
                </div>`;
            });
            whiteList.innerHTML = whiteHtml;

            const blackContainer = document.getElementById("black-zone-dynamic");
            if (blackContainer) {
                let blackHtml = "";
                blackProducts.forEach(p => {
                    blackHtml += `
                    <div class="product-card">
                        <h3 style="font-size: 12px; margin: 0 0 4px 0;">${p.name}</h3>
                        <p class="price">${p.price} PLN</p>
                        <p style="font-size: 9px; color: #8892b0; margin: 0 0 6px 0;">${p.desc || ''}</p>
                        <button type="button" onclick="orderProduct('${p.name.replace(/'/g, "\\'")}', '${p.price} PLN (${_s.t1})')">Zamów</button>
                    </div>`;
                });
                blackContainer.innerHTML = blackHtml;
            }

            const adminManager = document.getElementById("admin-products-manager");
            if (adminManager) {
                let managerHtml = "";
                let all = [];
                whiteProducts.forEach(p => all.push({ ...p, zone: 'white' }));
                blackProducts.forEach(p => all.push({ ...p, zone: 'black' }));

                all.forEach(p => {
                    managerHtml += `
                    <div class="admin-item-row" id="row-${p.id}">
                        <div style="margin-bottom: 4px;">
                            <input type="text" id="edit-name-${p.id}" value="${p.name.replace(/"/g, '&quot;')}" style="margin-bottom: 2px; padding: 4px; font-size: 10px;">
                            <div style="display: flex; gap: 4px;">
                                <input type="text" id="edit-price-${p.id}" value="${p.price}" placeholder="Cena" style="width: 40%; padding: 4px; font-size: 10px;">
                                <input type="text" id="edit-desc-${p.id}" value="${p.desc ? p.desc.replace(/"/g, '&quot;') : ''}" placeholder="Opis" style="width: 60%; padding: 4px; font-size: 10px;">
                            </div>
                        </div>
                        <div style="display: flex; gap: 4px; align-items: center;">
                            <select id="edit-zone-${p.id}" style="background: #0b0c10; border: 1px solid #45a29e; color: #fff; padding: 2px; font-size: 9px; width: 35%;">
                                <option value="white" ${p.zone === 'white' ? 'selected' : ''}>Katalog Główny</option>
                                <option value="black" ${p.zone === 'black' ? 'selected' : ''}>${_s.t1}</option>
                            </select>
                            <button type="button" onclick="saveProduct(${p.id})" style="font-size:9px; padding:4px; background:#45a29e; color:#0b0c10; border:none; width: 32%; margin:0;">Zapisz</button>
                            <button type="button" onclick="deleteProduct(${p.id}, '${p.zone}')" style="font-size:9px; padding:4px; background:#ff4757; color:#0b0c10; border:none; width: 28%; margin:0;">Usuń</button>
                        </div>
                    </div>`;
                });
                adminManager.adminManagerHtml = managerHtml || '<span style="font-size:9px; color:#8892b0;">Brak dynamicznych zasobów.</span>';
                adminManager.innerHTML = adminManager.adminManagerHtml;
            }
        }

        function saveProduct(id) {
            const newName = document.getElementById(`edit-name-${id}`).value.trim();
            const newPrice = document.getElementById(`edit-price-${id}`).value.trim();
            const newDesc = document.getElementById(`edit-desc-${id}`).value.trim();
            const newZone = document.getElementById(`edit-zone-${id}`).value;

            if (!newName || !newPrice) {
                alert("Uzupełnij nazwę i cenę!");
                return;
            }

            let item = null;
            let idx = whiteProducts.findIndex(p => p.id === id);
            if (idx !== -1) {
                item = whiteProducts.splice(idx, 1)[0];
            } else {
                idx = blackProducts.findIndex(p => p.id === id);
                if (idx !== -1) {
                    item = blackProducts.splice(idx, 1)[0];
                }
            }

            if (!item) return;

            item.name = newName;
            item.price = newPrice;
            item.desc = newDesc;

            if (newZone === 'white') {
                whiteProducts.push(item);
            } else {
                blackProducts.push(item);
            }

            localStorage.setItem("white_products", JSON.stringify(whiteProducts));
            localStorage.setItem("black_products", JSON.stringify(blackProducts));
            renderDynamicProducts();
            alert("Zaktualizowano pomyślnie.");
        }

        function deleteProject(id, zone) {
            if (zone === 'white') {
                whiteProducts = whiteProducts.filter(p => p.id !== id);
                localStorage.setItem("white_products", JSON.stringify(whiteProducts));
            } else {
                blackProducts = blackProducts.filter(p => p.id !== id);
                localStorage.setItem("black_products", JSON.stringify(blackProducts));
            }
            renderDynamicProducts();
        }
        
        // Alias dla kompatybilności funkcji usuwania
        function deleteProduct(id, zone) {
            deleteProject(id, zone);
        }
    </script>
</body>
</html>
