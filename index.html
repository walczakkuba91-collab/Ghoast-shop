<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>// GHOST_SHOP</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            font-size: 11px;
            line-height: 1.4;
        }
        header {
            border-bottom: 1px dashed #45a29e;
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #66fcf1;
        }
        .sys-status {
            font-size: 9px;
            border: 1px solid #45a29e;
            padding: 2px 6px;
            background: #1f2833;
        }
        .section-box {
            border: 1px dashed #45a29e;
            padding: 8px;
            margin-bottom: 10px;
            background: rgba(31, 40, 51, 0.4);
        }
        .section-title {
            font-size: 11px;
            font-weight: bold;
            color: #c5c6c7;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .product-card {
            border: 1px solid #45a29e;
            padding: 8px;
            margin-bottom: 8px;
            background: #0b0c10;
        }
        .price {
            color: #45a29e;
            font-weight: bold;
        }
        input[type="text"], input[type="password"], select {
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: #66fcf1;
            padding: 6px;
            font-family: inherit;
            font-size: 11px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 6px;
        }
        button {
            background: #1f2833;
            border: 1px solid #45a29e;
            color: #66fcf1;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }
        button:hover {
            background: #45a29e;
            color: #0b0c10;
        }
        .hidden {
            display: none;
        }
        .warning {
            color: #ff4757;
            font-size: 10px;
        }
        .form-group {
            margin-bottom: 6px;
        }
        .form-group label {
            display: block;
            font-size: 9px;
            color: #8892b0;
            margin-bottom: 2px;
        }
        .admin-item-row {
            border: 1px solid #1f2833;
            padding: 6px;
            margin-bottom: 6px;
            background: #0b0c10;
        }
        #bot-check-field {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">// GHOST_SHOP</div>
        <div class="sys-status" id="sys-status-badge">SYS: OK</div>
    </header>

    <!-- Zabezpieczenie przed botami (honeypot) -->
    <input type="text" id="bot-check-field" autocomplete="off" tabindex="-1">

    <div id="banned-panel" class="section-box hidden" style="border-color: #ff4757;">
        <div class="section-title" style="color: #ff4757;">// DOSTĘP ZABLOKOWANY</div>
        <p class="warning">Wykryto niedozwoloną aktywność lub przekroczono limit prób autoryzacji.</p>
        <button type="button" onclick="resetBan()" style="margin-top: 8px; border-color: #ff4757; color: #ff4757;">Zresetuj blokadę</button>
    </div>

    <div id="main-store">
        <div class="section-box">
            <div class="section-title">Katalog Główny</div>
            <div id="white-zone-list"></div>
        </div>

        <div class="section-box">
            <div class="section-title">Płatność / Przelew XMR</div>
            <div class="form-group">
                <label>Adres kontaktowy:</label>
                <div id="contact-email-container" style="color: #66fcf1; font-weight: bold; margin-bottom: 6px; word-break: break-all;">[Ładowanie...]</div>
            </div>
            <div class="form-group">
                <label>Portfel / Adres docelowy:</label>
                <div id="xmr-address-container" style="word-break: break-all; background: #0b0c10; border: 1px solid #45a29e; padding: 6px; font-size: 10px; margin-bottom: 6px;">[Ładowanie...]</div>
            </div>
            <button type="button" onclick="sendConfirmation()">Wyślij Potwierdzenie</button>
        </div>

        <div class="section-box">
            <div class="section-title">Strefa Autoryzacji (Węzeł)</div>
            <input type="password" id="accessCodeInput" placeholder="Wprowadź klucz (np. 1984 / 2001)...">
            <button type="button" id="verifyBtn">Wykonaj</button>
            <div id="attempts-warning" class="warning" style="margin-top: 6px;"></div>
        </div>
    </div>

    <div id="restricted-zone" class="section-box hidden" style="border-color: #45a29e;">
        <div id="dynamic-zone-content"></div>
    </div>

    <script>
        // Reset ewentualnych blokad przy starcie
        localStorage.removeItem("node_banned");
        if (localStorage.getItem("failed_attempts") > 2) {
            localStorage.setItem("failed_attempts", "0");
        }

        const _secLayer = {
            d: function(b64) {
                try {
                    return atob(b64);
                } catch(e) {
                    return "";
                }
            }
        };

        const _s = {
            k1: "1984",
            k2: "2001",
            t1: "Podsystem Kolekcjonerski", 
            t2: "Pakiet Specjalny AK", 
            t3: "Specyfikacja archiwalna i parametry", 
            m:  _secLayer.d("dXJiZXhvd3lfdilAcHJvdG9uLm1l"), 
            xmr: _secLayer.d("NlBOdFZvV3I3RG9KZkt6SFJXVVkzajZhcjd1NDdFOTNqd2k1c3FzRG81QWpSMlJ3ZXE5eDVTZ3JYS2ZHOUwxQlZLV0NoU3l4TURLNzZ5cU1ZU25zJUdNMyJTY3I=") || "45PNtVoWTr7DoJkZhXRWUY3i6ar7u47E95jwi5sqsDo5Ap2RWeq9x5SgEXKfG9L1BMVKWChSyxMEK76yqMYSrnsGM3J1Cr"
        };

        let validCodes = JSON.parse(localStorage.getItem("valid_codes") || JSON.stringify([_s.k1, _s.k2]));
        let whiteProducts = JSON.parse(localStorage.getItem("white_products") || '[]');
        let blackProducts = JSON.parse(localStorage.getItem("black_products") || '[]');
        let failedAttempts = parseInt(localStorage.getItem("failed_attempts") || "0");
        const maxAttempts = 3;

        const defaultWhiteProducts = [
            { name: "Koszulka Standard (Napisy / Kościół Szatana w Pruszkowie)", price: "77.00 PLN", desc: "Wysyłka wliczona | Monero (XMR)" },
            { name: "Autorski Trunek: Leśny Ród (Czarna Porzeczka & Mięta) [~12%]", price: "38.50 PLN", desc: "Butelka 0.5L | Fermentacja kontrolowana" },
            { name: "Autorski Trunek: Bursztyn Pruszkowski (Jabłko & Cynamon) [~12%]", price: "38.50 PLN", desc: "Butelka 0.5L | Aromat korzenny" },
            { name: "Autorski Trunek: Betonowy Sad (Gruszka & Wanilia) [~12%]", price: "38.50 PLN", desc: "Butelka 0.5L | Profil gładki" },
            { name: "Agrestowy Light [~12-14%]", price: "16.50 PLN", desc: "Flaszka | Rześki, konkretnie kwaśny profil z naturalnego agrestu" },
            { name: "Wiśniowa Lekkość [~12-14%]", price: "16.50 PLN", desc: "Flaszka | Głęboki, naturalny smak dojrzałej wiśni" },
            { name: "Czarna Porzeczka [~12-14%]", price: "16.50 PLN", desc: "Flaszka | Wyrazisty, ciemny trunek z czarnej porzeczki" },
            { name: "Cytrynowe Żylety [~12-14%]", price: "16.50 PLN", desc: "Flaszka | Orzeźwiająca bomba cytrusowa" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem("sec_access");

            document.getElementById("contact-email-containerinnerText" in document.getElementById("contact-email-container") ? "innerText" : "textContent") = _s.m;
            document.getElementById("contact-email-container").innerText = _s.m;
            document.getElementById("xmr-address-container").innerText = _s.xmr;

            renderDynamicProducts();
            updateAttemptsDisplay();

            document.getElementById("verifyBtn").addEventListener("click", verifyAndUnlock);
            document.getElementById("accessCodeInput").addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    verifyAndUnlock();
                }
            });
        });

        function orderProduct(name, price) {
            const subject = encodeURIComponent(`Zamówienie: ${name}`);
            const body = encodeURIComponent(`Dzień dobry,\n\nChciałbym zamówić:\n- Pozycja: ${name}\n- Wartość: ${price}\n\nDane / Potwierdzenie XMR:\n[Wpisz szczegóły]`);
            window.location.href = `mailto:${_s.m}?subject=${subject}&body=${body}`;
        }

        function sendConfirmation() {
            const subject = encodeURIComponent(`Potwierdzenie przelewu XMR`);
            const body = encodeURIComponent(`Dzień dobry,\n\nPrzesyłam potwierdzenie / szczegóły transakcji XMR na adres:\n${_s.xmr}\n\nSzczegóły:\n[Wpisz tutaj dane]`);
            window.location.href = `mailto:${_s.m}?subject=${subject}&body=${body}`;
        }

        function resetBan() {
            localStorage.removeItem("node_banned");
            localStorage.setItem("failed_attempts", "0");
            location.reload();
        }

        function verifyAndUnlock() {
            const val = document.getElementById("accessCodeInput").value.trim();
            
            if (val === _s.k1 || val === _s.k2 || validCodes.includes(val)) {
                localStorage.setItem("sec_access", "true");
                localStorage.setItem("failed_attempts", "0");
                
                buildRestrictedZone(val === _s.k2);
                
                document.getElementById("restricted-zone").classList.remove("hidden");
                document.getElementById("restricted-zone").scrollIntoView({ behavior: 'smooth' });
            } else {
                failedAttempts++;
                localStorage.setItem("failed_attempts", failedAttempts);
                if (failedAttempts >= maxAttempts) {
                    localStorage.setItem("node_banned", "true");
                    document.getElementById("main-store").style.display = "none";
                    document.getElementById("banned-panel").classList.remove("hidden");
                } else {
                    updateAttemptsDisplay();
                    alert("Błędny klucz autoryzacji.");
                }
            }
        }

        function buildRestrictedZone(isAdmin) {
            const container = document.getElementById("dynamic-zone-content");
            let html = `<h2 style="font-size: 13px; margin-top:0;">// ${_s.t1}</h2>`;

            if (isAdmin) {
                html += `
                <div id="admin-menu" style="border: 1px dashed #45a29e; padding: 6px; margin-bottom: 8px;">
                    <h3 style="margin: 0 0 6px 0; font-size: 11px;">// PANEL ADMINISTRATORA (ROOT)</h3>
                    <div class="form-group">
                        <label>Katalog docelowy:</label>
                        <select id="adm-zone">
                            <option value="white">Katalog Główny</option>
                            <option value="black">${_s.t1}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nazwa pozycji:</label>
                        <input type="text" id="adm-name" placeholder="Nazwa">
                    </div>
                    <div class="form-group">
                        <label>Cena:</label>
                        <input type="text" id="adm-price" placeholder="Cena">
                    </div>
                    <div class="form-group">
                        <label>Opis / Parametry:</label>
                        <input type="text" id="adm-desc" placeholder="Opis">
                    </div>
                    <button type="button" onclick="adminAddProduct()" style="border-color: #ff4757; color: #ff4757; margin-bottom: 6px;">Dodaj Pozycję</button>
                    <hr style="border: 0; border-top: 1px dashed #45a29e; margin: 8px 0;">
                    <p style="font-size: 9px; color: #66fcf1; margin: 0 0 4px 0;">Zarządzanie zasobami:</p>
                    <div id="admin-products-manager"></div>
                    <hr style="border: 0; border-top: 1px dashed #45a29e; margin: 8px 0;">
                    <div class="form-group">
                        <label>Nowy klucz dostępu:</label>
                        <input type="text" id="adm-new-code" placeholder="Klucz">
                    </div>
                    <button type="button" onclick="adminAddCode()">Dodaj Klucz</button>
                </div>`;
            }

            html += `<div id="black-zone-dynamic"></div>`;

            html += `
            <div class="product-card">
                <h3 style="font-size: 12px; margin: 0 0 4px 0;">${_s.t2}</h3>
                <p style="font-size: 9px; color: #8892b0; margin: 0 0 6px 0;">${_s.t3}</p>
                <div style="margin: 6px 0; text-align: center;">
                    <img src="ak47_1421.jpg" alt="AK" style="max-width: 100%; height: auto; border: 1px solid #45a29e;">
                </div>
                <ul style="padding-left: 12px; margin: 4px 0;">
                    <li style="font-size: 11px; margin-bottom: 4px;">1 jedn. – <span class="price">27.50 zł</span></li>
                    <li style="font-size: 11px; margin-bottom: 4px;">3+1 jedn. – <span class="price">65.00 zł</span></li>
                    <li style="font-size: 11px; margin-bottom: 4px;">5+2 jedn. – <span class="price">87.00 zł</span></li>
                    <li style="font-size: 11px; margin-bottom: 4px;">10+4 jedn. – <span class="price">153.00 zł</span></li>
                </ul>
                <button type="button" onclick="orderProduct('${_s.t2}', 'Od 27.50 PLN (${_s.t1})')">Zamów pakiet</button>
            </div>
            <button type="button" onclick="lockZone()" style="background: #ff4757; color: #0b0c10; border: none; margin-top: 10px;">Zamknij strefę</button>`;

            container.innerHTML = html;
            renderDynamicProducts();
        }

        function updateAttemptsDisplay() {
            let rem = maxAttempts - failedAttempts;
            if (rem < 0) rem = 0;
            const el = document.getElementById("attempts-warning");
            if (el) el.innerText = "Pozostałe próby: " + rem;
        }

        function lockZone() {
            localStorage.removeItem("sec_access");
            document.getElementById("restricted-zone").classList.add("hidden");
            document.getElementById("accessCodeInput").value = "";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function adminAddProduct() {
            const zone = document.getElementById("adm-zone").value;
            const name = document.getElementById("adm-name").value.trim();
            const price = document.getElementById("adm-price").value.trim();
            const desc = document.getElementById("adm-desc").value.trim();

            if (!name || !price) {
                alert("Uzupełnij nazwę i cenę!");
                return;
            }

            const item = { id: Date.now(), name, price, desc };
            if (zone === "white") {
                whiteProducts.push(item);
                localStorage.setItem("white_products", JSON.stringify(whiteProducts));
            } else {
                blackProducts.push(item);
                localStorage.setItem("black_products", JSON.stringify(blackProducts));
            }
            renderDynamicProducts();
            document.getElementById("adm-name").value = "";
            document.getElementById("adm-price").value = "";
            document.getElementById("adm-desc").value = "";
        }

        function adminAddCode() {
            const code = document.getElementById("adm-new-code").value.trim();
            if (!code) return;
            if (!validCodes.includes(code)) {
                validCodes.push(code);
                localStorage.setItem("valid_codes", JSON.stringify(validCodes));
                document.getElementById("adm-new-code").value = "";
                alert("Klucz został dodany.");
            }
        }

        function renderDynamicProducts() {
            const whiteList = document.getElementById("white-zone-list");
            if (!whiteList) return;
            
            let whiteHtml = "";
            
            defaultWhiteProducts.forEach(p => {
                whiteHtml += `
                <div class="product-card">
                    <h3 style="font-size: 12px; margin: 0 0 4px 0;">${p.name}</h3>
                    <p class="price">${p.price}</p>
                    <p class="calc-note" style="margin: 4px 0; font-size:10px; color:#8892b0;">${p.desc}</p>
                    <button type="button" onclick="orderProduct('${p.name.replace(/'/g, "\\'")}', '${p.price}')">Kup / Zamów</button>
                </div>`;
            });

            whiteProducts.forEach(p => {
                whiteHtml += `
                <div class="product-card">
                    <h3 style="font-size: 12px; margin: 0 0 4px 0;">${p.name}</h3>
                    <p class="price">${p.price} PLN</p>
                    <p class="calc-note" style="margin: 4px 0; font-size:10px; color:#8892b0;">${p.desc || ''}</p>
                    <button type="button" onclick="orderProduct('${p.name.replace(/'/g, "\\'")}', '${p.price} PLN')">Kup / Zamów</button>
                </div>`;
            });
            whiteList.innerHTML = whiteHtml;

            const blackContainer = document.getElementById("black-zone-dynamic");
            if (blackContainer) {
                let blackHtml = "";
                blackProducts.forEach(p => {
                    blackHtml += `
                    <div class="product-card">
                        <h3 style="font-size: 12px; margin: 0 0 4px 0;">${p.name}</h3>
                        <p class="price">${p.price} PLN</p>
                        <p style="font-size: 9px; color: #8892b0; margin: 0 0 6px 0;">${p.desc || ''}</p>
                        <button type="button" onclick="orderProduct('${p.name.replace(/'/g, "\\'")}', '${p.price} PLN (${_s.t1})')">Zamów</button>
                    </div>`;
                });
                blackContainer.innerHTML = blackHtml;
            }

            const adminManager = document.getElementById("admin-products-manager");
            if (adminManager) {
                let managerHtml = "";
                let all = [];
                whiteProducts.forEach(p => all.push({ ...p, zone: 'white' }));
                blackProducts.forEach(p => all.push({ ...p, zone: 'black' }));

                all.forEach(p => {
                    managerHtml += `
                    <div class="admin-item-row" id="row-${p.id}">
                        <div style="margin-bottom: 4px;">
                            <input type="text" id="edit-name-${p.id}" value="${p.name.replace(/"/g, '&quot;')}" style="margin-bottom: 2px; padding: 4px; font-size: 10px;">
                            <div style="display: flex; gap: 4px;">
                                <input type="text" id="edit-price-${p.id}" value="${p.price}" placeholder="Cena" style="width: 40%; padding: 4px; font-size: 10px;">
                                <input type="text" id="edit-desc-${p.id}" value="${p.desc ? p.desc.replace(/"/g, '&quot;') : ''}" placeholder="Opis" style="width: 60%; padding: 4px; font-size: 10px;">
                            </div>
                        </div>
                        <div style="display: flex; gap: 4px; align-items: center;">
                            <select id="edit-zone-${p.id}" style="background: #0b0c10; border: 1px solid #45a29e; color: #fff; padding: 2px; font-size: 9px; width: 35%;">
                                <option value="white" ${p.zone === 'white' ? 'selected' : ''}>Katalog Główny</option>
                                <option value="black" ${p.zone === 'black' ? 'selected' : ''}>${_s.t1}</option>
                            </select>
                            <button type="button" onclick="saveProduct(${p.id})" style="font-size:9px; padding:4px; background:#45a29e; color:#0b0c10; border:none; width: 32%; margin:0;">Zapisz</button>
                            <button type="button" onclick="deleteProduct(${p.id}, '${p.zone}')" style="font-size:9px; padding:4px; background:#ff4757; color:#0b0c10; border:none; width: 28%; margin:0;">Usuń</button>
                        </div>
                    </div>`;
                });
                adminManager.innerHTML = managerHtml || '<span style="font-size:9px; color:#8892b0;">Brak dodatkowych pozycji.</span>';
            }
        }

        function saveProduct(id) {
            const newName = document.getElementById(`edit-name-${id}`).value.trim();
            const newPrice = document.getElementById(`edit-price-${id}`).value.trim();
            const newDesc = document.getElementById(`edit-desc-${id}`).value.trim();
            const newZone = document.getElementById(`edit-zone-${id}`).value;

            if (!newName || !newPrice) {
                alert("Uzupełnij nazwę i cenę!");
                return;
            }

            let item = null;
            let idx = whiteProducts.findIndex(p => p.id === id);
            if (idx !== -1) {
                item = whiteProducts.splice(idx, 1)[0];
            } else {
                idx = blackProducts.findIndex(p => p.id === id);
                if (idx !== -1) {
                    item = blackProducts.splice(idx, 1)[0];
                }
            }

            if (!item) return;

            item.name = newName;
            item.price = newPrice;
            item.desc = newDesc;

            if (newZone === 'white') {
                whiteProducts.push(item);
            } else {
                blackProducts.push(item);
            }

            localStorage.setItem("white_products", JSON.stringify(whiteProducts));
            localStorage.setItem("black_products", JSON.stringify(blackProducts));
            renderDynamicProducts();
            alert("Zaktualizowano pomyślnie.");
        }

        function deleteProduct(id, zone) {
            if (zone === 'white') {
                whiteProducts = whiteProducts.filter(p => p.id !== id);
                localStorage.setItem("white_products", JSON.stringify(whiteProducts));
            } else {
                blackProducts = blackProducts.filter(p => p.id !== id);
                localStorage.setItem("black_products", JSON.stringify(blackProducts));
            }
            renderDynamicProducts();
        }
    </script>
</body>
</html>
